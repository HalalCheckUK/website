<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Halal Check UK</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#25A062;--forest:#0E3B2A;--mint:#E3F5EC;--bg:#F6FBF8;--card:#fff;--line:#E0EDE5;--text:#10261c;--muted:#6b7f74;
--amber:#B87000;--amber-bg:#FCF1DC;--red:#C62E32;--red-bg:#FBEAEA;--ok-bg:#E3F5EC}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(14,59,42,.08)}
.login img{width:56px;height:56px;border-radius:14px}
.login h1{font-size:22px;margin:14px 0 4px}.login p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
input[type=email],input[type=password],input[type=search]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:#fff}
.btn{height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--green);color:#fff;font-weight:700}
.btn.full{width:100%;margin-top:18px;height:48px}
.btn.ghost{background:#fff;color:var(--forest);border:1px solid var(--line)}
.btn.red{background:var(--red)}.btn.amber{background:var(--amber)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:240px;background:var(--forest);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px;font-weight:800}
.brand img{width:34px;height:34px;border-radius:9px}
.nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;color:#cfe6da;padding:11px 12px;border-radius:12px;font-weight:600;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--green);color:#fff}
.badge{background:#fff;color:var(--forest);border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px;min-width:22px;text-align:center}
.badge.warn{background:var(--amber-solid,#F5A524)}
.side .foot{margin-top:auto;font-size:12.5px;color:#9cc1af;padding:0 8px}
.side .foot button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px;margin-top:8px}
main{flex:1;padding:28px 32px;max-width:1200px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h2{margin:0;font-size:26px;letter-spacing:-.4px}.sub{color:var(--muted);font-size:14px;margin-top:2px}
.demo{background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:5px 12px;font-weight:800;font-size:12px}
/* cards */
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .n{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi.alert{border-color:#F3D08A;background:#FFFAF0}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.card h3{margin:0 0 12px;font-size:16px}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}
.split i{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px}
.bars div{flex:1;background:var(--green);border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px;white-space:nowrap;margin-bottom:4px}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.list .row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .t{font-weight:700}.list .s{font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.pill.halal{background:var(--ok-bg);color:#17734a}.pill.doubtful{background:var(--amber-bg);color:var(--amber)}.pill.haram{background:var(--red-bg);color:var(--red)}
.pill.ver{background:var(--forest);color:#fff}
/* review */
.rv{display:grid;grid-template-columns:150px 1fr;gap:18px}
.photos{display:flex;flex-direction:column;gap:8px}
.photos img{width:150px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:var(--mint)}
.noimg{width:150px;height:110px;border-radius:12px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;text-align:center;padding:8px}
.rv h3{margin:0 0 4px}.rv .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.ing{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;max-height:96px;overflow:auto}
.notes{font-size:13px;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.search{display:flex;gap:10px;margin-bottom:14px}.search input{max-width:420px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:9}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
@media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;padding:12px}.nav{display:flex;gap:6px;overflow-x:auto}.nav button{white-space:nowrap;width:auto}.side .foot{display:none}.brand{padding-bottom:10px}main{padding:18px 16px}.rv{grid-template-columns:1fr}.photos{flex-direction:row}}
.nm{cursor:pointer;border-bottom:1px dashed var(--muted)}.nm:hover{color:var(--forest)}.nm::after{content:' \270E';font-size:.8em;color:var(--muted)}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form id="loginForm">
    <img src="../logo.png" alt="">
    <h1>Halal Check UK admin</h1>
    <p>Sign in to review products and see how the app is doing.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn full" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><img src="../logo.png" alt=""><span>Halal Check UK<br><small style="font-weight:600;color:#9cc1af">Admin</small></span></div>
    <nav class="nav" id="nav">
      <button data-v="overview" class="on">Overview</button>
      <button data-v="review">Review queue <span class="badge warn" id="bReview">0</span></button>
      <button data-v="reports">Reports <span class="badge" id="bReports">0</span></button>
      <button data-v="products">Products</button>
      <button data-v="activity">Activity</button>
    </nav>
    <div class="foot"><div id="who"></div><button id="out">Sign out</button></div>
  </aside>
  <main>
    <div class="top"><div><h2 id="title">Overview</h2><div class="sub" id="subtitle"></div></div><span class="demo hidden" id="demoTag">DEMO DATA</span></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ── Settings ── the key below is the public (publishable) key, the same one the app uses. */
const SUPABASE_URL='https://tularxaodnylofjuvicg.supabase.co';
const SUPABASE_KEY='sb_publishable_e2D5gFY2178kuXsrjPaZiA_gaELYzEh';
const BUCKET='halal-label-photos';
const DEMO=new URLSearchParams(location.search).has('demo');

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'};
const num=n=>Number(n||0).toLocaleString('en-GB');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2600)}

/* ── Data layer: demo data or Supabase ── */
let sb=null,api;
if(DEMO){
  const day=i=>{const d=new Date();d.setDate(d.getDate()-13+i);return d.toISOString().slice(0,10)};
  const demo={
    overview:{products:1842,halal:1190,doubtful:402,haram:250,verified:37,waiting_review:6,new_products_7d:64,contributors_1d:18,contributors_7d:73,contributors_30d:141,contributors_all:212,submissions:530,submissions_7d:88,votes:964,halal_claims:9,reports_open:4,reports_7d:11,store_links:2310,
      devices:{total:212,android:212,ios:0,active_1d:34,active_7d:121,active_30d:190,android_7d:121,ios_7d:0,new_7d:48},
      daily:Array.from({length:14},(_,i)=>({date:day(i),active_devices:[12,15,14,22,30,26,24,31,38,35,29,40,44,34][i],new_devices:[3,4,2,7,9,5,4,8,9,7,6,11,8,10][i],contributors:[4,6,5,9,12,8,7,11,14,13,10,16,18,15][i],new_products:[3,5,2,8,12,6,4,9,11,10,7,14,9,12][i],reports:[0,1,0,2,1,0,1,2,0,1,3,1,0,2][i]}))},
    queue:[
      {barcode:'5028217001202',name:'Chicken seasoning',brand:'Spice House',verdict:'haram',trust_level:'label_checked',ingredients_text:'Kylling, tørret ingefær 3%, tørret hvitløk 3%, salt, pepper, kanel. Kan inneholde spor av trenøtter, hvete, melk, soya, sennep og sulfitt.',halal_claims:3,agree_count:1,disagree_count:3,notes:['Halal label seen on the pack (customer report). Photo: demo/1.jpg','Halal label seen on the pack (customer report)'],photos:[]},
      {barcode:'5012345678900',name:'Beef burgers 4 pack',brand:'Lidl',verdict:'haram',trust_level:'database',ingredients_text:'Beef (92%), rusk (wheat flour), water, salt, spices.',halal_claims:1,agree_count:0,disagree_count:1,notes:['Halal label seen on the pack (customer report)'],photos:[]},
      {barcode:'8801234567890',name:'Marshmallows',brand:'Sweet Co',verdict:'doubtful',trust_level:'label_checked',ingredients_text:'Sugar, glucose syrup, gelatine, flavouring.',halal_claims:2,agree_count:2,disagree_count:2,notes:['Halal label seen on the pack (customer report)'],photos:[]}],
    reports:[
      {id:1,barcode:'5000000000011',name:'Chocolate cake',brand:'Demo Bakery',image_url:null,ingredients_text:'Sugar, flour, eggs, cocoa, gelatine, flavouring',verdict:'doubtful',note:'Reason: It should be Halal\nNote: Vegetarian label on the box',created_at:new Date(Date.now()-3600e3).toISOString()},
      {id:2,barcode:'5000000000028',name:'Cheese slices',verdict:'halal',note:'Reason: The ingredients are wrong or out of date',created_at:new Date(Date.now()-9e6).toISOString()},
      {id:3,barcode:'5000000000035',name:'Ham slices',verdict:'haram',note:'Reason: Something else\nNote: this one is turkey ham',created_at:new Date(Date.now()-86400e3).toISOString()}],
    products:[
      {barcode:'5028217001202',name:'Chicken seasoning',brand:'Spice House',verdict:'haram',trust_level:'label_checked',halal_claims:3,agree_count:1,disagree_count:3},
      {barcode:'5012345678901',name:'Garden peas',brand:'Lidl',verdict:'halal',trust_level:'confirmed',halal_claims:0,agree_count:12,disagree_count:0},
      {barcode:'5012345678902',name:'Digestive biscuits',brand:'Tesco',verdict:'halal',trust_level:'community',halal_claims:0,agree_count:8,disagree_count:1}],
    activity:[
      {kind:'Label checked',barcode:'5028217001202',detail:'haram',at:new Date(Date.now()-600e3).toISOString()},
      {kind:'Vote disagree',barcode:'5012345678900',detail:'actually_halal_certified',at:new Date(Date.now()-1500e3).toISOString()},
      {kind:'Shop found',barcode:'5012345678902',detail:'Lidl',at:new Date(Date.now()-3000e3).toISOString()},
      {kind:'Vote agree',barcode:'5012345678901',detail:'',at:new Date(Date.now()-7200e3).toISOString()}]
  };
  api={user:async()=>({email:'halalcheckuk@gmail.com'}),signIn:async()=>{},signOut:async()=>location.reload(),
    overview:async()=>demo.overview,queue:async()=>demo.queue,reports:async()=>demo.reports,products:async q=>demo.products.filter(p=>(p.name+p.brand+p.barcode).toLowerCase().includes((q||'').toLowerCase())),
    activity:async()=>demo.activity,del:async b=>{demo.products=demo.products.filter(x=>x.barcode!==b)},edit:async(b,n,br)=>{const p=demo.products.find(x=>x.barcode===b);if(p){p.name=n;p.brand=br}},decide:async(b,a)=>{demo.queue=demo.queue.filter(x=>x.barcode!==b)},resolve:async id=>{demo.reports=demo.reports.filter(x=>x.id!==id)},delReport:async id=>{demo.reports=demo.reports.filter(x=>x.id!==id)},photo:async()=>null};
}else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const rpc=async(n,a)=>{const{data,error}=await sb.rpc(n,a||{});if(error)throw new Error(error.message);return data};
  api={
    user:async()=>{const{data}=await sb.auth.getSession();return data.session?.user||null},
    signIn:async(e,p)=>{const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error},
    signOut:async()=>{await sb.auth.signOut();location.reload()},
    overview:()=>rpc('admin_overview'),queue:()=>rpc('admin_review_queue'),reports:()=>rpc('admin_reports',{p_open_only:true}),
    products:q=>rpc('admin_products',{p_query:q||''}),activity:()=>rpc('admin_recent_activity'),
    decide:(b,a)=>rpc('admin_decide',{p_barcode:b,p_action:a}),resolve:id=>rpc('admin_resolve_report',{p_id:id}),delReport:id=>rpc('admin_delete_report',{p_id:id}),del:b=>rpc('admin_delete_product',{p_barcode:b}),edit:(b,n,br)=>rpc('admin_update_product',{p_barcode:b,p_name:n,p_brand:br}),
    photo:async path=>{const{data}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);return data?.signedUrl||null}
  };
}

/* ── Views ── */
const views={
  async overview(){
    const o=await api.overview();setBadges(o);
    const max=k=>Math.max(1,...o.daily.map(d=>d[k]));
    const bars=k=>`<div class="bars">${o.daily.map(d=>`<div style="height:${Math.max(3,d[k]/max(k)*100)}%" data-t="${esc(d.date.slice(5))}: ${d[k]}"></div>`).join('')}</div><div class="axis"><span>${esc(o.daily[0].date.slice(5))}</span><span>${esc(o.daily.at(-1).date.slice(5))}</span></div>`;
    const t=Math.max(1,o.halal+o.doubtful+o.haram);const pc=n=>(n/t*100).toFixed(1);
    const kpi=(l,n,d,cls='')=>`<div class="card kpi ${cls}"><div class="l">${l}</div><div class="n">${num(n)}</div><div class="d">${d}</div></div>`;
    const act=await api.activity();
    const dv=o.devices||{total:0,android:0,ios:0,active_1d:0,active_7d:0,active_30d:0,android_7d:0,ios_7d:0,new_7d:0};
    const dt=Math.max(1,dv.android+dv.ios);
    const devCard=`<div class="card"><h3>Devices · Android and iOS</h3>
      <div class="kpis grid" style="grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
        <div><div class="l" style="font-size:12px;color:var(--muted);font-weight:700">INSTALLS</div><div style="font-size:30px;font-weight:800">${num(dv.total)}</div><div class="s" style="font-size:13px;color:var(--muted)">${num(dv.new_7d)} new in 7 days</div></div>
        <div><div class="l" style="font-size:12px;color:var(--muted);font-weight:700">ACTIVE TODAY</div><div style="font-size:30px;font-weight:800">${num(dv.active_1d)}</div><div class="s" style="font-size:13px;color:var(--muted)">${num(dv.active_7d)} in 7 days</div></div>
        <div><div class="l" style="font-size:12px;color:var(--muted);font-weight:700">ACTIVE (30 DAYS)</div><div style="font-size:30px;font-weight:800">${num(dv.active_30d)}</div></div>
      </div>
      <div class="split"><i style="width:${(dv.android/dt*100).toFixed(1)}%;background:var(--green)"></i><i style="width:${(dv.ios/dt*100).toFixed(1)}%;background:var(--forest)"></i></div>
      <div class="legend"><span><span class="dot" style="background:var(--green)"></span>Android ${num(dv.android)} · ${num(dv.android_7d)} active in 7 days</span><span><span class="dot" style="background:var(--forest)"></span>iOS ${num(dv.ios)} · ${num(dv.ios_7d)} active in 7 days</span></div>
      ${dv.total?'':'<p class="sub" style="margin-top:12px">No devices yet. They appear once phones run the app version that counts installs.</p>'}</div>`;
    return `<div class="grid kpis">
      ${kpi('Products',o.products,`${num(o.new_products_7d)} new in 7 days`)}
      ${kpi('Waiting for review',o.waiting_review,'halal labels and flagged results',o.waiting_review?'alert':'')}
      ${kpi('Active contributors (7 days)',o.contributors_7d,`${num(o.contributors_1d)} today · ${num(o.contributors_30d)} in 30 days`)}
      ${kpi('Open reports',o.reports_open,`${num(o.reports_7d)} in the last 7 days`)}
      ${kpi('Verified halal',o.verified,'confirmed by you or a scholar')}
      ${kpi('Label checks',o.submissions,`${num(o.submissions_7d)} in 7 days`)}
      ${kpi('Community votes',o.votes,`${num(o.halal_claims)} halal-label reports`)}
      ${kpi('Shop links',o.store_links,'products placed in a supermarket')}
    </div>
    <div class="grid two">
      ${devCard}
      <div class="card"><h3>Active devices per day</h3>${bars('active_devices')}</div>
      <div class="card"><h3>What the database says</h3>
        <div class="split"><i style="width:${pc(o.halal)}%;background:var(--green)"></i><i style="width:${pc(o.doubtful)}%;background:#F5A524"></i><i style="width:${pc(o.haram)}%;background:var(--red)"></i></div>
        <div class="legend"><span><span class="dot" style="background:var(--green)"></span>Halal ${num(o.halal)}</span><span><span class="dot" style="background:#F5A524"></span>Doubtful ${num(o.doubtful)}</span><span><span class="dot" style="background:var(--red)"></span>Haram ${num(o.haram)}</span></div>
        <p class="sub" style="margin-top:16px">${num(o.contributors_all)} different phones have contributed since launch.</p></div>
      <div class="card"><h3>Active contributors per day</h3>${bars('contributors')}</div>
      <div class="card"><h3>New products per day</h3>${bars('new_products')}</div>
      <div class="card"><h3>Latest activity</h3><div class="list">${act.slice(0,6).map(a=>`<div class="row"><div><div class="t">${esc(a.kind)}</div><div class="s">${esc(a.barcode)}${a.detail?' · '+esc(a.detail):''}</div></div><div class="s">${ago(a.at)}</div></div>`).join('')||'<div class="empty">Nothing yet</div>'}</div></div>
    </div>
    <p class="sub" style="margin-top:16px">"Devices" counts every phone that opens the app (from the app version that includes counting). "Contributors" counts phones that checked a label, voted, or reported a shop.</p>`;
  },
  async review(){
    const q=await api.queue();$('#bReview').textContent=q.length;
    if(!q.length)return '<div class="card empty">Nothing is waiting for review. 🎉</div>';
    const cards=await Promise.all(q.map(async p=>{
      const paths=[...new Set((p.notes||[]).map(n=>(String(n).match(/Photo:\s*(\S+\.jpg)/)||[])[1]).filter(Boolean))].slice(0,3);
      const urls=(await Promise.all(paths.map(x=>api.photo(x).catch(()=>null)))).filter(Boolean);
      const notes=(p.notes||[]).map(n=>String(n).replace(/\.?\s*Photo:\s*\S+/,'')).filter(Boolean);
      return `<div class="card rv" data-b="${esc(p.barcode)}">
        <div class="photos">${urls.length?urls.map(u=>`<img src="${esc(u)}" alt="Halal label photo" data-zoom>`).join(''):'<div class="noimg">No photo sent</div>'}</div>
        <div><h3><span class="nm" data-editp data-name="${esc(p.name||'')}" data-brand="${esc(p.brand||'')}" title="Click to edit the name and brand">${esc(p.name||'Unnamed product')}</span></h3>
        <div class="meta"><span class="pill ${esc(p.verdict)}">${esc(p.verdict)}</span><span>${esc(p.brand||'No brand')}</span><span>· ${esc(p.barcode)}</span><span>· ${num(p.halal_claims)} halal-label report${p.halal_claims==1?'':'s'}</span><span>· ${num(p.agree_count)} agree / ${num(p.disagree_count)} disagree</span></div>
        <div class="ing">${esc(p.ingredients_text||'No ingredients saved.')}</div>
        ${notes.length?`<div class="notes">Shopper comments: ${notes.slice(0,5).map(esc).join(' · ')}</div>`:''}
        <div class="actions"><button class="btn" data-a="approve">Approve as Halal</button><button class="btn red" data-a="haram">Keep Haram</button><button class="btn amber" data-a="doubtful">Mark Doubtful</button><button class="btn ghost" data-a="dismiss">Dismiss</button></div></div></div>`;
    }));
    return `<div class="grid">${cards.join('')}</div><p class="sub" style="margin-top:14px"><b>Approve</b> shows Halal with "Confirmed by Halal Check UK". <b>Keep Haram</b> clears the reports. Check the photo and ingredients first.</p>`;
  },
  async reports(){
    const r=await api.reports();
    if(!r.length){$('#bReports').textContent=0;return '<div class="card empty">No open reports.</div>'}
    const groups=new Map();
    for(const x of r){if(!groups.has(x.barcode))groups.set(x.barcode,[]);groups.get(x.barcode).push(x)}
    $('#bReports').textContent=groups.size;
    const cards=await Promise.all([...groups.values()].map(async list=>{
      const p=list[0];
      const items=await Promise.all(list.map(async x=>{const path=(String(x.note||'').match(/Photo:\s*(\S+\.jpg)/)||[])[1];const url=path?await api.photo(path).catch(()=>null):null;return {...x,url,text:String(x.note||'').replace(/\.?\s*Photo:\s*\S+/,'')}}));
      const ids=list.map(x=>x.id).join(',');
      const img=p.image_url?`<img src="${esc(p.image_url)}" alt="Product picture" data-zoom style="width:96px;height:96px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:zoom-in">`:'<div class="noimg" style="width:96px;height:96px">No picture</div>';
      const ing=p.ingredients_text?esc(p.ingredients_text):'<i>No ingredients saved for this product.</i>';
      return `<div class="card" data-b="${esc(p.barcode)}" data-ids="${ids}" style="margin-bottom:12px">
        <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">${img}
          <div style="flex:1;min-width:200px"><div class="t"><span class="nm" data-editp data-name="${esc(p.name||'')}" data-brand="${esc(p.brand||'')}" title="Click to edit the name and brand">${esc(p.name||'Unknown product')}</span> <span class="pill ${esc(p.verdict||'doubtful')}">${esc(p.verdict||'?')}</span></div>
          <div class="s">${p.brand?esc(p.brand)+' · ':''}Barcode ${esc(p.barcode)}${p.trust_level?' · '+esc(p.trust_level):''}</div>
          <div class="notes" style="margin-top:8px"><b>Ingredients:</b> ${ing}</div></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm" data-a="approve">Halal</button><button class="btn sm amber" data-a="doubtful">Doubtful</button><button class="btn sm red" data-a="haram">Haram</button><button class="btn sm ghost" data-resolve>Mark done</button><button class="btn sm red" data-delall>Delete</button></div></div>
        <div style="margin-top:12px;border-top:1px solid var(--line)">${items.map(x=>`<div style="padding:8px 0" data-rid="${x.id}"><div class="s">${ago(x.created_at)} · <a href="#" data-delrep style="color:var(--red)">Delete this report</a></div><div style="white-space:pre-line">${esc(x.text)}</div>${x.url?`<div class="photos" style="margin-top:8px"><img src="${esc(x.url)}" alt="Photo from the report" data-zoom></div>`:''}</div>`).join('')}</div></div>`}));
    return cards.join('')+'<p class="sub">Halal, Doubtful or Haram changes the product and clears all its reports. Mark done only clears the reports.</p>';
  },
  async products(){
    return `<div class="search"><input type="search" id="q" placeholder="Search name, brand or barcode"><button class="btn" id="go">Search</button></div><div id="res" class="card"><div class="empty">Loading…</div></div>`;
  },
  async activity(){
    const a=await api.activity();
    return `<div class="card list">${a.map(x=>`<div class="row"><div><div class="t">${esc(x.kind)}</div><div class="s">${esc(x.barcode)}${x.detail?' · '+esc(x.detail):''}</div></div><div class="s">${ago(x.at)}</div></div>`).join('')||'<div class="empty">Nothing yet</div>'}</div>`;
  }
};
const meta={overview:['Overview','How the app and the database are doing'],review:['Review queue','Products waiting for your decision'],reports:['Reports','Wrong-result reports from shoppers'],products:['Products','Find a product and change its verdict'],activity:['Activity','The latest things shoppers did']};
function setBadges(o){$('#bReview').textContent=o.waiting_review;$('#bReports').textContent=o.reports_open}

async function productRows(q){
  const list=await api.products(q);const box=$('#res');
  if(!list.length){box.innerHTML='<div class="empty">No products found.</div>';return}
  box.innerHTML=`<table><tr><th>Product</th><th>Verdict</th><th>Trust</th><th>Reports</th><th></th></tr>${list.map(p=>`<tr data-b="${esc(p.barcode)}"><td><b class="nm" data-editp data-name="${esc(p.name||'')}" data-brand="${esc(p.brand||'')}" title="Click to edit the name and brand">${esc(p.name)}</b><div class="s" style="color:var(--muted);font-size:13px">${esc(p.brand||'')} · ${esc(p.barcode)}</div></td><td><span class="pill ${esc(p.verdict)}">${esc(p.verdict)}</span></td><td>${['confirmed','scholar'].includes(p.trust_level)?'<span class="pill ver">Verified</span>':esc(p.trust_level||'')}</td><td>${num(p.halal_claims)}</td><td style="white-space:nowrap"><button class="btn sm" data-a="approve">Halal</button> <button class="btn sm amber" data-a="doubtful">Doubtful</button> <button class="btn sm red" data-a="haram">Haram</button> <button class="btn sm" data-del="1" title="Delete this product" style="border-color:#c0392b;color:#c0392b">Delete</button></td></tr>`).join('')}</table>`;
}

let current='overview';
async function show(v){
  current=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#title').textContent=meta[v][0];$('#subtitle').textContent=meta[v][1];
  const el=$('#view');el.innerHTML='<div class="card empty">Loading…</div>';
  try{el.innerHTML=await views[v]();if(v==='products'){productRows('');}}
  catch(e){el.innerHTML=`<div class="card empty">Could not load: ${esc(e.message)}<br><small>If this says "not allowed", your email is not in the admins list.</small></div>`}
}

document.addEventListener('click',async e=>{
  const nav=e.target.closest('#nav button');if(nav)return show(nav.dataset.v);
  if(e.target.matches('[data-zoom]')){const l=document.createElement('div');l.className='lightbox';l.innerHTML=`<img src="${esc(e.target.src)}" alt="">`;l.onclick=()=>l.remove();document.body.append(l);return}
  if(e.target.id==='go')return productRows($('#q').value);
  const ed=e.target.closest('[data-edit]');
  if(ed){
    const row=ed.closest('[data-b]');const b=row.dataset.b;
    const oldName=row.querySelector('b').textContent;
    const oldBrand=(row.querySelector('.s').textContent.split(' · ')[0]||'').trim();
    const n=prompt('Product name:',oldName);if(n===null)return;
    if(!n.trim()){toast('The name cannot be empty');return}
    const br=prompt('Brand (leave empty for none):',oldBrand);if(br===null)return;
    try{await api.edit(b,n,br);toast('Saved');productRows($('#q').value)}catch(err){toast('Error: '+err.message)}
    return}
  const del=e.target.closest('[data-del]');
  if(del){
    const row=del.closest('[data-b]');const b=row.dataset.b;
    const name=row.querySelector('b').textContent;
    if(!confirm('Delete "'+name+'" ('+b+') for good?\nIts votes and reports are deleted too. This cannot be undone.'))return;
    del.disabled=true;
    try{await api.del(b);toast('Deleted');productRows($('#q').value)}catch(err){toast('Error: '+err.message);del.disabled=false}
    return}
  const dec=e.target.closest('[data-a]');
  if(dec){
    const row=dec.closest('[data-b]');const b=row.dataset.b,a=dec.dataset.a;
    if(a==='approve'&&!confirm('Approve this product as Halal? Check the photo and ingredients first.'))return;
    dec.disabled=true;
    try{await api.decide(b,a);if(current==='reports'){for(const id of (row.dataset.ids||'').split(',').filter(Boolean))await api.resolve(Number(id))}toast('Saved');current==='products'?productRows($('#q').value):show(current)}catch(err){toast('Error: '+err.message);dec.disabled=false}
    return}
  const ep=e.target.closest('[data-editp]');
  if(ep){
    const box=ep.closest('[data-b]');const b=box.dataset.b;
    const n=prompt('Product name:',ep.dataset.name||'');if(n===null)return;
    if(!n.trim()){toast('The name cannot be empty');return}
    const br=prompt('Brand (leave empty for none):',ep.dataset.brand||'');if(br===null)return;
    try{await api.edit(b,n,br);toast('Saved');current==='products'?productRows($('#q').value):show(current)}catch(err){toast('Error: '+err.message)}
    return}
  const dr=e.target.closest('[data-delrep]');
  if(dr){e.preventDefault();const id=Number(dr.closest('[data-rid]').dataset.rid);if(!confirm('Delete this report for good? This cannot be undone.'))return;try{await api.delReport(id);toast('Report deleted');show('reports')}catch(err){toast('Error: '+err.message)}return}
  const da=e.target.closest('[data-delall]');
  if(da){const box=da.closest('[data-ids]');const ids=(box.dataset.ids||'').split(',').filter(Boolean).map(Number);if(!confirm('Delete '+ids.length+' report(s) for this product for good? The product itself is kept. This cannot be undone.'))return;da.disabled=true;try{for(const id of ids)await api.delReport(id);toast('Reports deleted');show('reports')}catch(err){toast('Error: '+err.message);da.disabled=false}return}
  const res=e.target.closest('[data-resolve]');
  if(res){const box=res.closest('[data-ids]');const ids=(box.dataset.ids||'').split(',').filter(Boolean).map(Number);res.disabled=true;try{for(const id of ids)await api.resolve(id);box.remove();toast('Marked done');show('reports')}catch(err){toast('Error: '+err.message);res.disabled=false}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q')productRows(e.target.value)});
$('#out').onclick=()=>api.signOut();
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();$('#loginErr').textContent='';
  try{await api.signIn($('#em').value.trim(),$('#pw').value);start()}catch(err){$('#loginErr').textContent='Sign-in failed. Check your email and password.'}
};
async function start(){
  const u=await api.user();
  if(!u){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#who').textContent=u.email;if(DEMO)$('#demoTag').classList.remove('hidden');
  show('overview');
}
start();
</script>
</body>
</html>
