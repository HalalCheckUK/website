<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Halal Check UK</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#25A062;--forest:#0E3B2A;--mint:#E3F5EC;--bg:#F6FBF8;--card:#fff;--line:#E0EDE5;--text:#10261c;--muted:#6b7f74;
--amber:#B87000;--amber-bg:#FCF1DC;--red:#C62E32;--red-bg:#FBEAEA;--ok-bg:#E3F5EC}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(14,59,42,.08)}
.login img{width:56px;height:56px;border-radius:14px}
.login h1{font-size:22px;margin:14px 0 4px}.login p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
input[type=email],input[type=password],input[type=search]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:#fff}
.btn{height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--green);color:#fff;font-weight:700}
.btn.full{width:100%;margin-top:18px;height:48px}
.btn.ghost{background:#fff;color:var(--forest);border:1px solid var(--line)}
.btn.red{background:var(--red)}.btn.amber{background:var(--amber)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:240px;background:var(--forest);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px;font-weight:800}
.brand img{width:34px;height:34px;border-radius:9px}
.nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;color:#cfe6da;padding:11px 12px;border-radius:12px;font-weight:600;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--green);color:#fff}
.badge{background:#fff;color:var(--forest);border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px;min-width:22px;text-align:center}
.badge.warn{background:var(--amber-solid,#F5A524)}
.side .foot{margin-top:auto;font-size:12.5px;color:#9cc1af;padding:0 8px}
.side .foot button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px;margin-top:8px}
main{flex:1;padding:28px 32px;max-width:1200px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h2{margin:0;font-size:26px;letter-spacing:-.4px}.sub{color:var(--muted);font-size:14px;margin-top:2px}
.demo{background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:5px 12px;font-weight:800;font-size:12px}
/* cards */
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .n{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi.alert{border-color:#F3D08A;background:#FFFAF0}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.card h3{margin:0 0 12px;font-size:16px}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}
.split i{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px}
.bars div{flex:1;background:var(--green);border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px;white-space:nowrap;margin-bottom:4px}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.list .row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .t{font-weight:700}.list .s{font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.pill.halal{background:var(--ok-bg);color:#17734a}.pill.doubtful{background:var(--amber-bg);color:var(--amber)}.pill.haram{background:var(--red-bg);color:var(--red)}
.pill.ver{background:var(--forest);color:#fff}
/* review */
.rv{display:grid;grid-template-columns:150px 1fr;gap:18px}
.photos{display:flex;flex-direction:column;gap:8px}
.photos img{width:150px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:var(--mint)}
.noimg{width:150px;height:110px;border-radius:12px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;text-align:center;padding:8px}
.rv h3{margin:0 0 4px}.rv .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.ing{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;max-height:96px;overflow:auto}
.notes{font-size:13px;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.search{display:flex;gap:10px;margin-bottom:14px}.search input{max-width:420px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:9}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
@media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;padding:12px}.nav{display:flex;gap:6px;overflow-x:auto}.nav button{white-space:nowrap;width:auto}.side .foot{display:none}.brand{padding-bottom:10px}main{padding:18px 16px}.rv{grid-template-columns:1fr}.photos{flex-direction:row}}
.nm{cursor:pointer;border-bottom:1px dashed var(--muted)}.nm:hover{color:var(--forest)}.nm::after{content:' \270E';font-size:.8em;color:var(--muted)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fbar input,.fbar select{height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;background:#fff;font:inherit;min-width:150px}.fbar input{flex:1;min-width:220px;max-width:360px}
.pg{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--forest);border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}.chip a{cursor:pointer;color:var(--muted);font-weight:800;padding:0 4px}.chip a:hover{color:var(--red)}
.pimg{width:46px;height:46px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff;flex:none}.pimg.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
select.addshop{height:30px;border-radius:999px;border:1px dashed var(--muted);background:#fff;color:var(--forest);font-size:12.5px;font-weight:700;padding:0 8px}
.nosh{color:var(--amber);font-size:12.5px;font-weight:700;margin-right:6px}

/* ── Modern look (overrides the basics above) ───────────────────────────── */
:root{--bg:#F2F6F4;--line:#E7EFEA;--shadow:0 1px 2px rgba(14,59,42,.04),0 8px 24px rgba(14,59,42,.06);--shadow-lg:0 2px 4px rgba(14,59,42,.05),0 18px 40px rgba(14,59,42,.10)}
body{background:radial-gradient(1100px 520px at 85% -10%,#DDF3E7 0%,rgba(221,243,231,0) 60%),var(--bg);-webkit-font-smoothing:antialiased}
.app{padding:14px;gap:18px}
.side{height:calc(100vh - 28px);top:14px;width:248px;border-radius:26px;padding:22px 14px;background:linear-gradient(165deg,#0F4A34 0%,#0B3324 55%,#082A1E 100%);box-shadow:var(--shadow-lg)}
.brand{padding:2px 10px 24px;font-size:15px;letter-spacing:-.2px}.brand img{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{gap:11px;justify-content:flex-start;padding:11px 12px;border-radius:14px;color:#BFDCCD;font-size:14.5px;transition:background .15s,color .15s,transform .15s}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav button .badge{margin-left:auto}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:linear-gradient(135deg,#2FB574,#1F9A5F);color:#fff;box-shadow:0 6px 16px rgba(37,160,98,.38)}
.badge{background:rgba(255,255,255,.95);font-size:11.5px;padding:1px 8px}
.badge.warn{background:#FFC24B;color:#5a3b00}
.side .foot{padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1)}
.side .foot button{border-radius:12px;width:100%;padding:9px 14px;transition:background .15s}.side .foot button:hover{background:rgba(255,255,255,.1)}
main{padding:18px 20px 40px 4px;max-width:1240px}
.top{margin-bottom:24px}
h2{font-size:30px;letter-spacing:-.8px;font-weight:800}.sub{font-size:14.5px}
.card{border:1px solid rgba(231,239,234,.9);border-radius:22px;padding:20px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.kpi{position:relative;overflow:hidden}.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(37,160,98,.16),rgba(37,160,98,0) 70%)}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kpi .l{font-size:11.5px;letter-spacing:.8px}.kpi .n{font-size:38px;letter-spacing:-1.5px;font-weight:800}
.kpi.alert{background:linear-gradient(180deg,#FFFBF1,#FFF6E3);border-color:#F5DCA4}.kpi.alert::after{background:radial-gradient(circle,rgba(245,165,36,.22),rgba(245,165,36,0) 70%)}
.card h3{font-size:16.5px;letter-spacing:-.2px}
.split{height:12px}.bars div{background:linear-gradient(180deg,#34C27F,#1F9A5F)}
.btn{box-shadow:0 2px 6px rgba(37,160,98,.28);transition:transform .12s,box-shadow .15s,filter .15s;font-weight:700}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(37,160,98,.32);filter:brightness(1.03)}.btn:active{transform:translateY(0)}
.btn.red{box-shadow:0 2px 6px rgba(198,46,50,.28)}.btn.red:hover{box-shadow:0 6px 14px rgba(198,46,50,.32)}
.btn.amber{box-shadow:0 2px 6px rgba(184,112,0,.28)}.btn.amber:hover{box-shadow:0 6px 14px rgba(184,112,0,.32)}
.btn.ghost{box-shadow:none;background:#fff}.btn.ghost:hover{box-shadow:var(--shadow);background:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
input[type=email],input[type=password],input[type=search],.fbar input,.fbar select{border-radius:14px;border-color:var(--line);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:#2FB574!important;box-shadow:0 0 0 4px rgba(47,181,116,.16)}
.fbar{background:#fff;padding:12px;border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pill{padding:3px 11px;font-size:11.5px;letter-spacing:.2px}
.pill.ver{background:linear-gradient(135deg,#145A3D,#0E3B2A)}
table{border-collapse:separate;border-spacing:0}th{background:#F7FAF8;font-size:11.5px;padding:10px 12px}th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{padding:13px 12px;border-top:1px solid var(--line)}tr:first-child td{border-top:0}
tbody tr,table tr[data-b]{transition:background .12s}table tr[data-b]:hover{background:#F8FCFA}
.rv{gap:20px}.photos img,.noimg{border-radius:16px}.ing{border-radius:14px;background:#F6FAF8}
.list .row{padding:12px 0}
.chip{background:#E5F6ED}.pimg{border-radius:12px;width:50px;height:50px}
.empty{padding:56px 10px}
.toast{border-radius:16px;box-shadow:var(--shadow-lg);padding:12px 20px}
.login{background:radial-gradient(900px 500px at 50% -10%,#CDEFDD,rgba(205,239,221,0) 60%),var(--bg)}
.login form{border-radius:26px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
@media(max-width:820px){.app{padding:10px;gap:10px}.side{height:auto;position:static;width:100%;border-radius:20px;padding:12px}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;width:auto}.brand{padding-bottom:10px}.side .foot{display:none}main{padding:6px 2px 30px}h2{font-size:24px}.rv{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr 56px;gap:12px;align-items:center;margin:9px 0;font-size:13.5px}.hb .nmx{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .track{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}.hb .track i{display:block;height:100%}.hb .v{text-align:right;color:var(--muted);font-weight:700}
.prog{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#34C27F,#1F9A5F);border-radius:99px}
.ins{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.ins .wide{grid-column:1/-1}
.mini .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.mini .row:first-child{border-top:0}.mini .row b{font-weight:700}.mini .row .s{color:var(--muted);font-size:12.5px}
@media(max-width:520px){.ins{grid-template-columns:1fr}.hb{grid-template-columns:90px 1fr 44px}}
.dlg-back{position:fixed;inset:0;background:rgba(8,42,30,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;animation:fade .15s}
.dlg{background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(8,42,30,.35);width:100%;max-width:440px;padding:26px;animation:pop .18s}
.dlg h3{margin:0 0 6px;font-size:20px;letter-spacing:-.4px}.dlg p{margin:0 0 14px;color:var(--muted);font-size:14.5px;white-space:pre-line}
.dlg label{margin:12px 0 6px}.dlg input[type=text]{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit}
.dlg .err{min-height:16px;margin-top:6px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form id="loginForm">
    <img src="../logo.png" alt="">
    <h1>Halal Check UK admin</h1>
    <p>Sign in to review products and see how the app is doing.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn full" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><img src="../logo.png" alt=""><span>Halal Check UK<br><small style="font-weight:600;color:#9cc1af">Admin</small></span></div>
    <nav class="nav" id="nav">
      <button data-v="overview" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Overview</button>
      <button data-v="review"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>Review queue <span class="badge warn" id="bReview">0</span></button>
      <button data-v="added"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.6"/><path d="M2.8 20c.6-3.4 3.2-5.4 6.2-5.4S14.6 16.6 15.2 20"/><path d="M19 8v6M16 11h6"/></svg>Added by users <span class="badge warn" id="bAdded">0</span></button>
      <button data-v="reports"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>Reports <span class="badge" id="bReports">0</span></button>
      <button data-v="products"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Products</button>
      <button data-v="insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
      <button data-v="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
    </nav>
    <div class="foot"><div id="who"></div><button id="out">Sign out</button></div>
  </aside>
  <main>
    <div class="top"><div><h2 id="title">Overview</h2><div class="sub" id="subtitle"></div></div><span class="demo hidden" id="demoTag">DEMO DATA</span></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ── Settings ── the key below is the public (publishable) key, the same one the app uses. */
const SUPABASE_URL='https://tularxaodnylofjuvicg.supabase.co';
const SUPABASE_KEY='sb_publishable_e2D5gFY2178kuXsrjPaZiA_gaELYzEh';
const BUCKET='halal-label-photos';
const DEMO=new URLSearchParams(location.search).has('demo');

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=d=>{if(!d)return'';const t=new Date(d);return t.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+', '+t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
const ago=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'};
const num=n=>Number(n||0).toLocaleString('en-GB');
/* Pop-up dialogs in the same style as the page (instead of the browser's plain boxes). */
function dialog({title,text='',fields=[],ok='OK',danger=false,cancel='Cancel'}){
  return new Promise(resolve=>{
    const back=document.createElement('div');back.className='dlg-back';
    back.innerHTML=`<form class="dlg" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${fields.map((f,i)=>`<label for="dlg${i}">${esc(f.label)}</label><input type="text" id="dlg${i}" value="${esc(f.value||'')}" autocomplete="off">`).join('')}<div class="err"></div><div class="acts"><button type="button" class="btn ghost" data-x>${esc(cancel)}</button><button type="submit" class="btn ${danger?'red':''}">${esc(ok)}</button></div></form>`;
    const done=v=>{back.remove();document.removeEventListener('keydown',onKey);resolve(v)};
    const onKey=e=>{if(e.key==='Escape')done(null)};
    document.addEventListener('keydown',onKey);
    back.addEventListener('mousedown',e=>{if(e.target===back)done(null)});
    back.querySelector('[data-x]').onclick=()=>done(null);
    back.querySelector('form').onsubmit=e=>{
      e.preventDefault();
      const vals=fields.map((f,i)=>back.querySelector('#dlg'+i).value.trim());
      const bad=fields.findIndex((f,i)=>f.required&&!vals[i]);
      if(bad>=0){back.querySelector('.err').textContent=fields[bad].label+' cannot be empty.';back.querySelector('#dlg'+bad).focus();return}
      done(fields.length?vals:true)};
    document.body.append(back);
    const first=back.querySelector('input');(first||back.querySelector('button[type=submit]')).focus();if(first)first.select();
  });
}

    const so=f.stores.map(x=>`<option value="${esc(x.store)}">${esc(x.store)} (${num(x.count)})</option>`).join('');
    const co=f.categories.map(x=>`<option value="${esc(x.category)}">${esc(x.category)} (${num(x.count)})</option>`).join('');
    return `<div class="fbar"><input type="search" id="q" placeholder="Search name, brand or barcode" value="${esc(pf.q)}"><select id="fs"><option value="">All shops (${num(f.total)})</option><option value="__none__">No shop yet (${num(f.no_shop)})</option>${so}</select><select id="fc"><option value="">All categories</option>${co}</select><select id="fv"><option value="">All verdicts</option><option value="halal">Halal</option><option value="doubtful">Doubtful</option><option value="haram">Haram</option></select><button class="btn" id="go">Search</button></div><div id="res" class="card"><div class="empty">Loading…</div></div><div class="pg" id="pg"></div>`;
  },
  async insights(){
    const [i,o]=await Promise.all([api.insights(),api.overview()]);setBadges(o);
    const col=(arr,k,c)=>{const m=Math.max(1,...arr.map(d=>d[k]));return `<div class="bars">${arr.map(d=>`<div style="height:${Math.max(3,d[k]/m*100)}%;${c?'background:'+c:''}" data-t="${esc(String(d.date).slice(5))}: ${d[k]}"></div>`).join('')}</div><div class="axis"><span>${esc(String(arr[0].date).slice(5))}</span><span>${esc(String(arr[arr.length-1].date).slice(5))}</span></div>`};
    const stack=(rows,note)=>{const m=Math.max(1,...rows.map(r=>r.total));return (rows.length?rows.map(r=>`<div class="hb"><span class="nmx" title="${esc(r.name)}">${esc(r.name)}</span><span class="track" style="width:${Math.max(4,r.total/m*100)}%"><i style="width:${r.halal/Math.max(1,r.total)*100}%;background:var(--green)"></i><i style="width:${r.doubtful/Math.max(1,r.total)*100}%;background:#F5A524"></i><i style="width:${r.haram/Math.max(1,r.total)*100}%;background:var(--red)"></i></span><span class="v">${num(r.total)}</span></div>`).join(''):'<div class="empty" style="padding:20px">Nothing yet.</div>')+(note||'')};
    const bar=(rows,c)=>{const m=Math.max(1,...rows.map(r=>r.total));return rows.length?rows.map(r=>`<div class="hb"><span class="nmx" title="${esc(r.name)}">${esc(r.name)}</span><span class="track"><i style="width:${r.total/m*100}%;background:${c}"></i></span><span class="v">${num(r.total)}</span></div>`).join(''):'<div class="empty" style="padding:20px">Nothing yet.</div>'};
    const legend='<div class="legend"><span><span class="dot" style="background:var(--green)"></span>Halal</span><span><span class="dot" style="background:#F5A524"></span>Doubtful</span><span><span class="dot" style="background:var(--red)"></span>Haram</span></div>';
    const g=i.growth;const sum=k=>g.reduce((a,d)=>a+d[k],0);
    const startMs=new Date('2026-10-19T00:00:00').getTime();const day=Math.max(1,Math.floor((Date.now()-startMs)/864e5)+1);const end=new Date(startMs+14*864e5);
    const ing=i.ingredients;const pcMiss=ing.total?(ing.missing/ing.total*100).toFixed(1):'0';
    const mp=i.missing_products;const c=i.community;
    const listMissing=ing.list.length?ing.list.map(x=>`<div class="row"><div><b>${esc(x.name||'Unnamed')}</b><div class="s">${esc(x.brand||'')} · ${esc(x.barcode)}</div></div><span class="pill ${esc(x.verdict)}">${esc(x.verdict)}</span></div>`).join(''):'<div class="empty" style="padding:20px">Every product has an ingredient list. 🎉</div>';
    const listWanted=mp.list.length?mp.list.map(x=>`<div class="row"><div><b>${esc(x.barcode)}</b><div class="s">last scanned ${ago(x.last_seen)}</div></div><span class="pill ver">${num(x.scan_count)} scan${x.scan_count==1?'':'s'}</span></div>`).join(''):'<div class="empty" style="padding:20px">Nothing yet. This fills in as people scan products we don\'t have (after the next app update).</div>';
    const listDisputed=c.most_disputed.length?c.most_disputed.map(x=>`<div class="row"><div><b>${esc(x.name||x.barcode)}</b><div class="s">${esc(x.barcode)}</div></div><span class="s">${num(x.agree_count)} agree · ${num(x.disagree_count)} disagree</span></div>`).join(''):'<div class="empty" style="padding:20px">No disagreements yet.</div>';
    const disagreeRate=c.votes_30d?Math.round(c.disagree_30d/c.votes_30d*100):0;
    return `<div class="grid ins">
      <div class="card wide"><h3>Google Play closed test</h3><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b style="font-size:22px">Day ${Math.min(day,14)} of 14</b><span class="sub">${num(o.devices.total)} phones have opened the app · ${num(o.devices.active_7d)} active this week</span></div><div class="prog"><i style="width:${Math.min(100,day/14*100)}%"></i></div><div class="sub">${day>=14?'The 14 days are done. You can apply for production.':'Finishes on '+end.toLocaleDateString('en-GB',{day:'numeric',month:'long'})+'. Keep adding testers until then.'}</div></div>
      <div class="card"><h3>New products per day <span class="sub">(last 30 days · ${num(sum('new_products'))} total)</span></h3>${col(g,'new_products')}</div>
      <div class="card"><h3>Label photos per day <span class="sub">(last 30 days · ${num(sum('label_photos'))} total)</span></h3>${col(g,'label_photos','linear-gradient(180deg,#F5B94A,#D98E0B)')}</div>
      <div class="card"><h3>Products per shop</h3>${stack(i.by_store,`<div class="sub" style="margin-top:8px">${num(i.no_shop)} products have no shop yet. Add one in Products &rarr; "No shop yet".</div>`)}${legend}</div>
      <div class="card"><h3>Products per category</h3>${stack(i.by_category)}${legend}</div>
      <div class="card"><h3>Where products came from</h3>${stack(i.by_source)}${legend}</div>
      <div class="card"><h3>Words found in Doubtful and Haram products</h3>${bar(i.flagged_words,'#D98E0B')}<div class="sub" style="margin-top:8px">Approximate: a text search of their ingredient lists. A good list to show a scholar.</div></div>
      <div class="card mini"><h3>Missing ingredients <span class="sub">(${num(ing.missing)} of ${num(ing.total)} products · ${pcMiss}%)</span></h3><div class="prog"><i style="width:${pcMiss}%;background:linear-gradient(90deg,#F5B94A,#D98E0B)"></i></div>${listMissing}<div class="sub" style="margin-top:8px">Newest 25 shown. These stay Doubtful until someone photographs the label.</div></div>
      <div class="card mini"><h3>Most-wanted missing products <span class="sub">(${num(mp.distinct)} barcodes)</span></h3>${listWanted}<div class="sub" style="margin-top:8px">Barcodes people scanned that we don't have anywhere, most scanned first.</div></div>
      <div class="card mini wide"><h3>Community health</h3><div class="grid kpis" style="margin-bottom:12px"><div class="card kpi"><div class="l">Votes (30 days)</div><div class="n">${num(c.votes_30d)}</div><div class="d">${disagreeRate}% said "No"</div></div><div class="card kpi"><div class="l">Open reports</div><div class="n">${num(c.reports_open)}</div><div class="d">${num(c.reports_resolved_30d)} resolved in 30 days</div></div><div class="card kpi"><div class="l">Time to resolve</div><div class="n">${c.avg_hours_to_resolve==null?'–':num(c.avg_hours_to_resolve)+'h'}</div><div class="d">average, last 30 days</div></div></div><h3 style="font-size:14px">Most disputed products</h3>${listDisputed}</div>
    </div>`;
  },
  async activity(){
    const a=await api.activity();
    return `<div class="card list">${a.map(x=>`<div class="row"><div><div class="t">${esc(x.kind)}</div><div class="s">${esc(x.barcode)}${x.detail?' · '+esc(x.detail):''}</div></div><div class="s">${ago(x.at)}</div></div>`).join('')||'<div class="empty">Nothing yet</div>'}</div>`;
  }
};
const meta={overview:['Overview','How the app and the database are doing'],added:['Added by users','Products saved by app users, newest first'],review:['Review queue','Products waiting for your decision'],reports:['Reports','Wrong-result reports from shoppers'],products:['Products','Find a product and change its verdict'],insights:['Insights','How the catalogue and the community are growing'],activity:['Activity','The latest things shoppers did']};
function setBadges(o){api.addedCount().then(n=>$('#bAdded').textContent=n).catch(()=>{});$('#bReview').textContent=o.waiting_review;$('#bReports').textContent=o.reports_open}

const pf={q:'',store:'',cat:'',verdict:'',offset:0,limit:40,f:null,total:0};
function readFilters(){pf.q=($('#q')||{}).value||'';pf.store=($('#fs')||{}).value||'';pf.cat=($('#fc')||{}).value||'';pf.verdict=($('#fv')||{}).value||''}
async function productRows(){
  const box=$('#res');if(!box)return;
  readFilters();
  const r=await api.browse({p_store:pf.store||null,p_category:pf.cat||null,p_verdict:pf.verdict||null,p_query:pf.q,p_limit:pf.limit,p_offset:pf.offset});
  const list=r.items||[];pf.total=r.total||0;
  if(!list.length&&pf.offset>0){pf.offset=Math.max(0,pf.offset-pf.limit);return productRows()}
  const all=(pf.f&&pf.f.stores||[]).map(x=>x.store);
  const pg=$('#pg');
  const from=list.length?pf.offset+1:0,to=pf.offset+list.length;
  if(pg)pg.innerHTML=`<span>Showing ${from}–${to} of ${num(pf.total)}</span><span><button class="btn sm ghost" id="pgPrev" ${pf.offset<=0?'disabled':''}>Previous</button> <button class="btn sm ghost" id="pgNext" ${to>=pf.total?'disabled':''}>Next</button></span>`;
  if(!list.length){box.innerHTML='<div class="empty">No products found.</div>';return}
  box.innerHTML=`<table><tr><th>Product</th><th>Category</th><th>Verdict</th><th>Shops</th><th></th></tr>${list.map(p=>{
    const have=p.stores||[];const free=all.filter(x=>!have.includes(x));
    const img=p.image_url?`<img class="pimg" src="${esc(p.image_url)}" alt="" data-zoom>`:'<div class="pimg none">No pic</div>';
    return `<tr data-b="${esc(p.barcode)}"><td><div style="display:flex;gap:10px;align-items:center">${img}<div><b class="nm" data-editp data-name="${esc(p.name||'')}" data-brand="${esc(p.brand||'')}" title="Click to edit the name and brand">${esc(p.name||'Unnamed product')}</b><div class="s" style="color:var(--muted);font-size:13px">${esc(p.brand||'')} · ${esc(p.barcode)}${['confirmed','scholar'].includes(p.trust_level)?' · <span class="pill ver">Verified</span>':''}${p.has_ingredients?'':' · no ingredients'}</div></div></div></td><td>${esc(p.category||'')}</td><td><span class="pill ${esc(p.verdict)}">${esc(p.verdict)}</span></td><td>${have.length?have.map(x=>`<span class="chip">${esc(x)} <a data-shop-rm="${esc(x)}" title="Remove this shop">×</a></span>`).join(''):'<span class="nosh">No shop yet</span>'}${free.length?`<select class="addshop" data-shop-add><option value="">+ Add shop</option>${free.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`:''}</td><td style="white-space:nowrap"><button class="btn sm" data-a="approve">Halal</button> <button class="btn sm amber" data-a="doubtful">Doubtful</button> <button class="btn sm red" data-a="haram">Haram</button> <button class="btn sm ghost" data-del="1" title="Delete this product" style="border-color:#c0392b;color:#c0392b">Delete</button></td></tr>`}).join('')}</table>`;
}

let current='overview';
async function show(v){
  current=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#title').textContent=meta[v][0];$('#subtitle').textContent=meta[v][1];
  const el=$('#view');el.innerHTML='<div class="card empty">Loading…</div>';
  try{el.innerHTML=await views[v]();if(v==='products'){pf.offset=0;productRows();}}
  catch(e){el.innerHTML=`<div class="card empty">Could not load: ${esc(e.message)}<br><small>If this says "not allowed", your email is not in the admins list.</small></div>`}
}

document.addEventListener('click',async e=>{
  const nav=e.target.closest('#nav button');if(nav)return show(nav.dataset.v);
  if(e.target.matches('[data-zoom]')){const l=document.createElement('div');l.className='lightbox';l.innerHTML=`<img src="${esc(e.target.src)}" alt="">`;l.onclick=()=>l.remove();document.body.append(l);return}
  if(e.target.id==='go'){pf.offset=0;return productRows()}
  if(e.target.id==='pgPrev'){pf.offset=Math.max(0,pf.offset-pf.limit);return productRows()}
  if(e.target.id==='pgNext'){pf.offset+=pf.limit;return productRows()}
  const sr=e.target.closest('[data-shop-rm]');
  if(sr){const b=sr.closest('[data-b]').dataset.b,st=sr.dataset.shopRm;if(!await askConfirm('Remove '+st+'?','This product will no longer show as sold at '+st+'.','Remove',true))return;try{await api.setStore(b,st,false);toast('Shop removed');productRows()}catch(err){toast('Error: '+err.message)}return}
  const ed=e.target.closest('[data-edit]');
  if(ed){
    const row=ed.closest('[data-b]');const b=row.dataset.b;
    const oldName=row.querySelector('b').textContent;
    const oldBrand=(row.querySelector('.s').textContent.split(' · ')[0]||'').trim();
    const r=await askEdit('Rename product',[{label:'Product name',value:oldName,required:true},{label:'Brand (optional)',value:oldBrand}]);if(!r)return;const [n,br]=r;
    try{await api.edit(b,n,br);toast('Saved');productRows()}catch(err){toast('Error: '+err.message)}
    return}
  if(e.target.closest('[data-seenall]')){try{await api.seen(null);toast('All marked as seen');show('added')}catch(err){toast('Error: '+err.message)}return}
  const sn=e.target.closest('[data-seen]');
  if(sn){const b=sn.closest('[data-b]').dataset.b;try{await api.seen(b);show('added')}catch(err){toast('Error: '+err.message)}return}
  const del=e.target.closest('[data-del]');
  if(del){
    const row=del.closest('[data-b]');const b=row.dataset.b;
    const name=row.querySelector('b').textContent;
    if(!await askConfirm('Delete this product?','"'+name+'" ('+b+') will be deleted for good, with its votes and reports. This cannot be undone.','Delete',true))return;
    del.disabled=true;
    try{await api.del(b);toast('Deleted');current==='added'?show('added'):productRows()}catch(err){toast('Error: '+err.message);del.disabled=false}
    return}
  const dec=e.target.closest('[data-a]');
  if(dec){
    const row=dec.closest('[data-b]');const b=row.dataset.b,a=dec.dataset.a;
    if(a==='approve'&&!await askConfirm('Approve as Halal?','This shows Halal with "Confirmed by Halal Check UK". Check the photo and ingredients first.','Approve as Halal'))return;
    dec.disabled=true;
    try{await api.decide(b,a);if(current==='added')await api.seen(b);if(current==='reports'){for(const id of (row.dataset.ids||'').split(',').filter(Boolean))await api.resolve(Number(id))}toast('Saved');current==='products'?productRows():show(current)}catch(err){toast('Error: '+err.message);dec.disabled=false}
    return}
  const ep=e.target.closest('[data-editp]');
  if(ep){
    const box=ep.closest('[data-b]');const b=box.dataset.b;
    const r=await askEdit('Rename product',[{label:'Product name',value:ep.dataset.name||'',required:true},{label:'Brand (optional)',value:ep.dataset.brand||''}]);if(!r)return;const [n,br]=r;
    try{await api.edit(b,n,br);toast('Saved');current==='products'?productRows():show(current)}catch(err){toast('Error: '+err.message)}
    return}
  const dr=e.target.closest('[data-delrep]');
  if(dr){e.preventDefault();const id=Number(dr.closest('[data-rid]').dataset.rid);if(!await askConfirm('Delete this report?','It will be deleted for good. This cannot be undone.','Delete',true))return;try{await api.delReport(id);toast('Report deleted');show('reports')}catch(err){toast('Error: '+err.message)}return}
  const da=e.target.closest('[data-delall]');
  if(da){const box=da.closest('[data-ids]');const ids=(box.dataset.ids||'').split(',').filter(Boolean).map(Number);if(!await askConfirm('Delete '+ids.length+' report'+(ids.length==1?'':'s')+'?','They will be deleted for good. The product itself is kept. This cannot be undone.','Delete',true))return;da.disabled=true;try{for(const id of ids)await api.delReport(id);toast('Reports deleted');show('reports')}catch(err){toast('Error: '+err.message);da.disabled=false}return}
  const res=e.target.closest('[data-resolve]');
  if(res){const box=res.closest('[data-ids]');const ids=(box.dataset.ids||'').split(',').filter(Boolean).map(Number);res.disabled=true;try{for(const id of ids)await api.resolve(id);box.remove();toast('Marked done');show('reports')}catch(err){toast('Error: '+err.message);res.disabled=false}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){pf.offset=0;productRows()}});
document.addEventListener('change',async e=>{
  if(['fs','fc','fv'].includes(e.target.id)){pf.offset=0;return productRows()}
  if(e.target.matches('[data-shop-add]')&&e.target.value){const b=e.target.closest('[data-b]').dataset.b,st=e.target.value;e.target.disabled=true;try{await api.setStore(b,st,true);toast(st+' added');productRows()}catch(err){toast('Error: '+err.message);e.target.disabled=false}}
});
$('#out').onclick=()=>api.signOut();
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();$('#loginErr').textContent='';
  try{await api.signIn($('#em').value.trim(),$('#pw').value);start()}catch(err){$('#loginErr').textContent='Sign-in failed. Check your email and password.'}
};
async function start(){
  const u=await api.user();
  if(!u){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#who').textContent=u.email;if(DEMO)$('#demoTag').classList.remove('hidden');
  show('overview');
}
start();
</script>
</body>
</html>
